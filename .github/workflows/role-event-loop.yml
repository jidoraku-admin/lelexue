name: 岗位事件循环

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  english-designer:
    # 只响应技术总监的意见，设计师自己的回复不触发
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '【技术总监｜英语') && !contains(github.event.comment.body, '【英语产品设计师')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login != '' && contains(github.event.review.body, '技术总监'))
    runs-on: ubuntu-latest
    steps:
      - name: 循环上限检查
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 统计本 issue 中英语产品设计师已回复的次数，超过 3 次停止自动循环
          ISSUE=7
          COUNT=$(gh api repos/${{ github.repository }}/issues/$ISSUE/comments --paginate --jq '[.[] | select(.body | contains("【英语产品设计师"))] | length' | awk '{s+=$1} END {print s}')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 3 ]; then
            echo "已达到循环上限（3 次），停止自动循环，转由技术总监或真人处理。"
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.stop == 'false'
        with:
          ref: feat/english-product-design-7
          fetch-depth: 0

      - name: 唤起英语产品设计师
        if: steps.guard.outputs.stop == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            你是乐乐学项目的英语子系统产品设计师。请先阅读 docs/automation/role-event-loop.md 中的循环规则，然后：
            1. 读取 issue #7 与 issue #35 中技术总监的最新意见，以及 PR #22 的审核评论。
            2. 只修改 docs/product/ 下的英语设计文档，按意见逐项修改。
            3. 不合并 PR，不修改 stage:* 标签，不做定稿决定。
            4. 修改完成后推送到 feat/english-product-design-7，并在 issue #35 回复，签名为【英语产品设计师｜英语｜#7】，写明每项的修改结果。
            5. 如有意见无法执行，写明理由，交回技术总监，不自行决定。
