# 本地开发用：身份服务的 MySQL 8（方案 A，不部署到线上）。
# 启动：docker compose -f services/identity/docker-compose.yml up -d
# 停止：docker compose -f services/identity/docker-compose.yml down
services:
  identity-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity
      MYSQL_USER: identity
      MYSQL_PASSWORD: identity
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  identity-test-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: identity_test
      MYSQL_USER: identity_test
      MYSQL_PASSWORD: identity_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
