<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <g stroke="#1f2a36" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 天线 -->
    <line x1="110" y1="30" x2="110" y2="8" stroke-width="5"/>
    <circle cx="110" cy="8" r="9" fill="#ff6b6b"/>
    <!-- 脑袋（圆形，像灯泡） -->
    <circle cx="110" cy="72" r="48" fill="#a9d8f5"/>
    <!-- 耳朵螺丝 -->
    <circle cx="62" cy="72" r="8" fill="#f2b632"/>
    <circle cx="158" cy="72" r="8" fill="#f2b632"/>
    <!-- 眼睛：一大一小，表情俏皮 -->
    <circle cx="92" cy="66" r="15" fill="#fff"/>
    <circle cx="128" cy="66" r="11" fill="#fff"/>
    <circle cx="95" cy="68" r="7" fill="#1f2a36"/>
    <circle cx="130" cy="68" r="5" fill="#1f2a36"/>
    <!-- 嘴：大笑 -->
    <path d="M86 94 Q110 118 134 94 Q130 110 110 112 Q90 110 86 94 Z" fill="#1f2a36"/>
    <path d="M96 102 Q110 108 124 102" stroke="#ff6b6b" stroke-width="4" fill="none"/>
    <!-- 身体 -->
    <rect x="80" y="122" width="60" height="62" rx="18" fill="#f2b632"/>
    <circle cx="110" cy="150" r="10" fill="#ff6b6b" stroke-width="3"/>
    <!-- 手（圆手套） -->
    <circle cx="56" cy="150" r="13" fill="#fff"/>
    <circle cx="164" cy="150" r="13" fill="#fff"/>
    <!-- 脚 -->
    <ellipse cx="94" cy="194" rx="16" ry="10" fill="#7a8a99"/>
    <ellipse cx="126" cy="194" rx="16" ry="10" fill="#7a8a99"/>
  </g>
</svg>
